<body>
<title>ICS Team Tracker</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: a monthly ledger — team × days heat grid is the home; entry, review and team tools sit behind tabs in one column */
:root{
  --bg:#F3F7F6; --surface:#FFFFFF; --sunk:#E9F0EE; --ink:#0D2925; --muted:#5A6F6B; --line:#D7E2DF;
  --mint:#00FFB3; --mint-ink:#007A58; --on-mint:#03241C;
  --warn:#8A5300; --warn-bg:#FFF3D6; --bad:#B4232A; --bad-bg:#FFECEC;
  --gold:#F5A524; --gold-bg:#FFF3D6; --gold-ink:#8A5300;
  --violet:#7C5CFF; --violet-bg:#EFEAFF; --violet-ink:#4B2FC9;
  --sky:#2F8CFF; --sky-bg:#E5F0FF; --sky-ink:#1559B8;
  --coral:#FF5A5F; --coral-bg:#FFECEC; --coral-ink:#B4232A;
  --pink:#E8458B; --pink-bg:#FFE6F1; --pink-ink:#A3155A;
  --shadow:0 1px 2px rgba(13,41,37,.06),0 6px 20px -8px rgba(13,41,37,.18);
  --f-display:"Jost","Futura","Avenir Next","Century Gothic",sans-serif;
  --f-body:"Instrument Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0A1412; --surface:#111F1C; --sunk:#0E1917; --ink:#E4F1EE; --muted:#8CA39E; --line:#22342F;
  --mint:#00FFB3; --mint-ink:#3DFFC4; --on-mint:#03241C;
  --warn:#FFD27A; --warn-bg:#33260D; --bad:#FFB3B5; --bad-bg:#3A1618;
  --gold:#FFC24D; --gold-bg:#33260D; --gold-ink:#FFD27A;
  --violet:#A08BFF; --violet-bg:#231C40; --violet-ink:#C9BCFF;
  --sky:#5AA8FF; --sky-bg:#0F2339; --sky-ink:#A3CEFF;
  --coral:#FF7A7E; --coral-bg:#3A1618; --coral-ink:#FFB3B5;
  --pink:#FF7AB6; --pink-bg:#3A1428; --pink-ink:#FFB8D8;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -10px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A1412; --surface:#111F1C; --sunk:#0E1917; --ink:#E4F1EE; --muted:#8CA39E; --line:#22342F;
  --mint:#00FFB3; --mint-ink:#3DFFC4; --on-mint:#03241C;
  --warn:#FFD27A; --warn-bg:#33260D; --bad:#FFB3B5; --bad-bg:#3A1618;
  --gold:#FFC24D; --gold-bg:#33260D; --gold-ink:#FFD27A;
  --violet:#A08BFF; --violet-bg:#231C40; --violet-ink:#C9BCFF;
  --sky:#5AA8FF; --sky-bg:#0F2339; --sky-ink:#A3CEFF;
  --coral:#FF7A7E; --coral-bg:#3A1618; --coral-ink:#FFB3B5;
  --pink:#FF7AB6; --pink-bg:#3A1428; --pink-ink:#FFB8D8;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -10px rgba(0,0,0,.6); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body)}
h1,h2,h3{font-family:var(--f-display);font-weight:500;margin:0;text-wrap:balance;letter-spacing:.01em}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--mint-ink);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header.top{background:#0D2925;color:#E4F1EE;padding-block:18px 0}
.brand{display:flex;align-items:center;gap:14px}
.brand img{width:30px;height:auto}
.brand h1{font-size:24px}
.brand h1 span{color:#00FFB3}
.brand .sub{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#8CA39E;font-family:var(--f-display)}
.who{margin-left:auto;font-size:13px;color:#B9CCC8;display:flex;flex-wrap:wrap;justify-content:flex-end;align-items:center;gap:8px 10px;text-align:right}
.who img{width:26px;height:26px;border-radius:50%}
nav.tabs{display:flex;gap:4px;margin-top:16px;overflow-x:auto}
nav.tabs button{background:none;border:0;padding:10px 14px;color:#B9CCC8;cursor:pointer;font-family:var(--f-display);font-size:15px;border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs button[aria-current="true"]{color:#fff;border-bottom-color:#00FFB3}
nav.tabs .badge{display:inline-block;min-width:20px;padding:0 6px;margin-left:6px;border-radius:10px;background:#00FFB3;color:#03241C;font:600 11px/18px var(--f-body)}

main{padding-block:24px 64px;display:grid;gap:20px}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.bar h2{font-size:26px}
.grow{flex:1}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--mint-ink)}
.btn.primary{background:var(--mint);border-color:var(--mint);color:var(--on-mint)}
.btn.primary:hover{filter:brightness(.95)}
.btn.ghost{background:none;border-color:transparent}
.btn:disabled{opacity:.5;cursor:default}
.btn.sm{padding:5px 10px;font-size:13px}
.icon-btn{width:34px;height:34px;padding:0;display:inline-grid;place-items:center}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.muted{color:var(--muted)}
.small{font-size:13px}
.eyebrow{font:500 11px/1 var(--f-display);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.note{padding:12px 14px;border-radius:8px;background:var(--sunk);font-size:14px}
.note.warn{background:var(--warn-bg);color:var(--warn)}
.note.bad{background:var(--bad-bg);color:var(--bad)}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* ledger grid */
.ledger-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table.ledger{border-collapse:separate;border-spacing:0;font-size:13px;min-width:100%}
.ledger th,.ledger td{padding:0;text-align:center;border-bottom:1px solid var(--line)}
.ledger thead th{font-weight:500;color:var(--muted);padding:8px 0 6px;font-size:11px;position:sticky;top:0;background:var(--surface)}
.ledger thead th b{display:block;font:500 13px var(--f-mono);color:var(--ink)}
.ledger thead th.sun b,.ledger thead th.sun{color:var(--muted)}
.ledger thead th.today b{color:var(--on-mint);background:var(--mint);border-radius:4px;margin:0 3px}
.ledger .name{position:sticky;left:0;background:var(--surface);text-align:left;padding:8px 14px;min-width:170px;z-index:1;border-right:1px solid var(--line)}
.ledger .name .n{font-weight:500;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px}
.ledger .name .t{font-size:12px;color:var(--muted)}
.ledger tbody tr:last-child td,.ledger tbody tr:last-child th{border-bottom:0}
.cell{width:34px;height:40px;margin:3px 1px;border:0;border-radius:6px;display:grid;place-items:center;font:500 13px var(--f-mono);cursor:pointer;background:var(--sunk);color:var(--muted)}
.cell.s{color:var(--ink)}
.cell.x{background:var(--ink);color:var(--mint)}
.cell.leave{background:repeating-linear-gradient(135deg,var(--sunk) 0 4px,transparent 4px 8px);color:var(--muted);border:1px solid var(--line)}
.cell.sun{background:transparent;color:var(--line)}
.cell.miss{background:transparent;border:1px dashed var(--line);color:var(--muted)}
.cell.pend{background:transparent;border:1px solid var(--mint-ink);color:var(--mint-ink)}
.cell.future{background:transparent;cursor:default}
.ledger td.sum{padding:0 12px;font:500 13px var(--f-mono);white-space:nowrap;border-left:1px solid var(--line)}
.ledger td.sum.total{font-size:15px;color:var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--muted);align-items:center}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend .cell{width:22px;height:22px;margin:0;font-size:11px;cursor:default}

/* forms */
.field{display:grid;gap:6px}
.field label{font-weight:500;font-size:14px}
textarea,input[type=text],input[type=date],input[type=number]{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%}
textarea{min-height:110px;resize:vertical}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--bg);border-radius:20px;padding:7px 14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--mint);border-color:var(--mint);color:var(--on-mint);font-weight:500}
.split{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:820px){.split{grid-template-columns:1fr}}
.stack{display:grid;gap:14px}

/* history + review */
.list{display:grid;gap:10px}
.item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:start;padding:14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.item .date{font:500 13px var(--f-mono);color:var(--muted);min-width:56px}
.item .body{min-width:0}
.item .body p{margin:2px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.chip{display:inline-block;padding:2px 9px;border-radius:12px;font-size:12px;font-weight:500;background:var(--sunk);color:var(--muted)}
.chip.ok{background:color-mix(in srgb,var(--mint) 26%,var(--surface));color:var(--ink)}
.chip.x{background:var(--ink);color:var(--mint)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.scorebig{font:500 26px/1 var(--f-mono);text-align:right}
.scorebig small{display:block;font:12px var(--f-body);color:var(--muted);margin-top:4px}

.rcard{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);display:grid;grid-template-columns:minmax(0,1fr) 230px}
@media (max-width:760px){.rcard{grid-template-columns:1fr}}
.rcard .l{padding:16px 18px;min-width:0;display:grid;gap:10px}
.rcard .r{padding:16px 18px;border-left:1px solid var(--line);background:var(--sunk);border-radius:0 var(--r) var(--r) 0;display:grid;gap:10px;align-content:start}
@media (max-width:760px){.rcard .r{border-left:0;border-top:1px solid var(--line);border-radius:0 0 var(--r) var(--r)}}
.rcard h3{font-size:17px}
.rcard .txt{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;margin:2px 0 0}
.ai{font-size:13px;line-height:1.45}
.ai b{font-family:var(--f-mono);font-size:20px;color:var(--mint-ink)}
.score-in{display:flex;gap:8px;align-items:center}
.score-in input{width:76px;font-family:var(--f-mono);text-align:center}

.people{display:grid;gap:8px}
.person{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;flex-wrap:wrap}
.person img{width:30px;height:30px;border-radius:50%}
.person .meta{flex:1;min-width:140px}
.rubric{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px;margin:0}
.rubric dt{font-family:var(--f-mono);font-weight:500;text-align:right}
.rubric dd{margin:0;color:var(--muted)}

/* plan + task checklist */

.tasks{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.task{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.task .tt{flex:1;min-width:160px;overflow-wrap:anywhere}
.task .src{font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.seg.sm button{padding:4px 10px;font-size:13px}
.seg button.no[aria-pressed="true"]{background:var(--bad-bg);border-color:var(--bad-bg);color:var(--bad)}
.seg button.part[aria-pressed="true"]{background:var(--warn-bg);border-color:var(--warn-bg);color:var(--warn)}
.plan-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.pcard{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:16px;display:grid;gap:10px;min-width:0}
.pcard h3{font-size:17px}
.pcard textarea{min-height:120px}
.routine{font-size:13px;color:var(--muted);white-space:pre-wrap;overflow-wrap:anywhere;background:var(--sunk);border-radius:6px;padding:8px 10px}
.status-list{display:grid;gap:4px;margin:4px 0 0;padding:0;list-style:none;font-size:14px}
.status-list li{display:flex;gap:8px;align-items:baseline}
.status-list .chip{flex:none}
label.check{display:inline-flex;gap:8px;align-items:center;font-size:14px;cursor:pointer}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(5,20,17,.45);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--surface);z-index:21;border-left:1px solid var(--line);padding:calc(20px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) 20px;overflow-y:auto;display:grid;gap:16px;align-content:start}
.drawer .close{justify-self:end}
.empty{text-align:center;padding:40px 20px}
.empty h3{font-size:20px;margin-bottom:6px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:30;font-size:14px}
@media (prefers-reduced-motion:no-preference){.drawer{animation:slide .18s ease-out}@keyframes slide{from{transform:translateX(24px);opacity:.6}}}

/* ===== colour layer ===== */
header.top{background:radial-gradient(90% 160% at 100% 0%,rgba(0,255,179,.28),transparent 55%),radial-gradient(60% 120% at 0% 100%,rgba(124,92,255,.22),transparent 60%),linear-gradient(135deg,#0B2420,#11403A);padding-block:20px 0}
.brand img{width:34px;filter:drop-shadow(0 0 12px rgba(0,255,179,.45))}
.brand h1{font-size:26px}
nav.tabs{gap:6px;margin-top:18px}
nav.tabs button{border:0;border-radius:10px 10px 0 0;padding:10px 16px;color:#A9C4BE}
nav.tabs button:hover{color:#fff;background:rgba(255,255,255,.06)}
nav.tabs button[aria-current="true"]{background:var(--bg);color:var(--ink);font-weight:500}
nav.tabs button[aria-current="true"] .badge{background:var(--sky);color:#fff}
nav.tabs .badge{background:#FFC24D;color:#2A1600}
.btn{border-radius:9px;transition:border-color .15s,box-shadow .15s,transform .15s}

<script>
const RUBRIC_ROWS=[
  ["6–10","Extraordinary work beyond a normal day. Admin-awarded, 10 is the maximum."],
  ["5","Full, productive day with clear completed output."],
  ["4","Good day with minor gaps."],
  ["3","Less work than expected."],
  ["2","No work given by the company (auto)."],
  ["≤4","Partial leave day: work logged on it scores up to 4."],
  ["0","Leave (paid or unpaid), weekly off, holiday, or a day not filled by 8 am IST the next day."],
  ["+","Worked on a holiday or weekly off: admin awards extra points."]
];
const S={db:null,user:null,sample:null,me:null,isAdmin:false,
  members:{},requests:{},myReq:null,entries:{},scores:{},
  month:todayKey().slice(0,7),view:"month",subs:{},membersLoaded:false,
  draft:null,draftDate:null,overrides:{},busy:false,drawer:null,err:null,plans:{},planDate:null,planDrafts:{},planWeek:false,routineDrafts:{},pendingRender:false,wdDrafts:{},redoOpen:null,holidays:{},leaves:{},emails:{emails:{}},hl:{hscope:"all",hsel:{},ltype:"paid"},reqDays:{},memDrafts:{}};
const STATUS={worked:"Worked",nowork:"No work given"};
const WD=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const DEFAULT_DAYS=[1,2,3,4,5];
function workdays(uid){const w=S.members[uid]?.workdays;return Array.isArray(w)&&w.length?w:DEFAULT_DAYS}
function isOff(uid,ym,d){return !workdays(uid).includes(dateOf(ym,d).getDay())}
function holidayOn(uid,ym,d){const x=S.holidays[ym]?.days?.[pad(d)];if(!x)return null;return x.scope==="all"||(Array.isArray(x.scope)&&x.scope.includes(uid))?x:null}
function leaveOn(uid,ym,d){return S.leaves[uid+"|"+ym]?.days?.[pad(d)]||null}
/* Partial leave: on leave but did a little work. The day still takes an update; task self-scores and the day's score go up to 4. */
const PARTIAL_MAX=4;
function fullLeaveOn(uid,ym,d){const l=leaveOn(uid,ym,d);return l&&l.type!=="partial"?l:null}
function partialOn(uid,ym,d){return leaveOn(uid,ym,d)?.type==="partial"}
function taskMax(uid,ym,d){return partialOn(uid,ym,d)?PARTIAL_MAX:5}
function leaveLabel(t){return t==="unpaid"?"Unpaid leave":t==="partial"?"Partial leave":"Paid leave"}
function unlocked(uid,ym,d){return !!S.plans[uid+"|"+ym]?.days?.[pad(d)]?.unlocked}
/* Every date and time is Indian Standard Time, whatever the device's own timezone. Updates stay open until 8 am IST the next day. */
const GRACE_HOUR=8;
function istParts(){const p={};for(const x of new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Kolkata",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hourCycle:"h23"}).formatToParts(new Date()))p[x.type]=x.value;return p}
function graceOpen(key){return key===keyAdd(todayKey(),-1)&&Number(istParts().hour)%24<GRACE_HOUR}
function fmtTime(ms){return new Date(ms).toLocaleString("en-IN",{timeZone:"Asia/Kolkata",dateStyle:"medium",timeStyle:"short"})+" IST"}
function canEditDay(uid,key){return key===todayKey()||graceOpen(key)||unlocked(uid,key.slice(0,7),Number(key.slice(8)))}
function keyAdd(k,n){const d=new Date(k+"T00:00:00");d.setDate(d.getDate()+n);return ymOf(d)+"-"+pad(d.getDate())}
function fmtKey(k){return new Date(k+"T00:00:00").toLocaleDateString("en-IN",{weekday:"short",day:"numeric",month:"short"})}
function dayToggles(arr,onchange){const box=h("div",{class:"days",role:"group","aria-label":"Working days"});
  [1,2,3,4,5,6,0].forEach(n=>box.append(h("button",{type:"button","aria-pressed":String(arr.includes(n)),onclick:()=>{const i=arr.indexOf(n);if(i>=0)arr.splice(i,1);else arr.push(n);onchange(arr)}},WD[n])));return box}
const CHECK={done:"Done",partial:"Partly",no:"Not done"};
function taskVal(v){if(v==null)return null;if(typeof v==="string")return{s:{done:5,partial:3,no:0}[v]??null,c:"",st:""};return{s:typeof v.s==="number"?v.s:null,c:v.c||"",st:v.st||""}}
function checkPill(t,v){if(t.src==="carried"||v?.st)return v?.st==="done"?["ok","Done"]:v?.st==="progress"?["sky","In progress"]:v?.s!=null?[sClass(v.s),v.s+"/5"]:["","Pending"];return v?.s!=null?[sClass(v.s),v.s+"/5"]:["","–/5"]}
function sClass(n){return n==null?"":n>=5?"ok":n>=3?"warn":"coral"}
function tkey(t){let x=5381;for(const c of t)x=((x<<5)+x+c.charCodeAt(0))>>>0;return"t"+x.toString(36)}
function lines(t){return String(t||"").split("\n").map(l=>l.replace(/^[\s\-*•\d.)]+/,"").trim()).filter(Boolean)}
function wdLabel(uid){const w=workdays(uid).slice().sort((a,b)=>((a+6)%7)-((b+6)%7));const s=w.join();return s==="1,2,3,4,5"?"Mon–Fri":s==="1,2,3,4,5,6"?"Mon–Sat":w.map(n=>WD[n]).join(" ")}
function isWorkDay(uid,key){const ym=key.slice(0,7),d=Number(key.slice(8));return!isOff(uid,ym,d)&&!holidayOn(uid,ym,d)&&!fullLeaveOn(uid,ym,d)}
function prevPlanDay(uid,key){let k=key;for(let i=0;i<21;i++){k=keyAdd(k,-1);if(isWorkDay(uid,k))return k}return null}
function nextPlanDay(uid,key){let k=key;for(let i=0;i<60;i++){k=keyAdd(k,1);if(isWorkDay(uid,k))return k}return keyAdd(key,1)}
function planDoc(uid,key){return S.plans[uid+"|"+key.slice(0,7)]?.days?.[key.slice(8)]||null}
function redoDefault(uid,fromKey){const t=todayKey();if(fromKey<t&&isWorkDay(uid,t))return t;return nextPlanDay(uid,fromKey<t?t:fromKey)}
/* Task list for a person on a day: daily routine, admin redo requests, unfinished tasks carried from the previous working day, then that day's assigned tasks.
   A task carries forward until the employee scores it 5/5 or the admin removes it. */
const CARRY_DEPTH=20;
/* Task priority. Urgent + High priority together = Critical. Order: Critical, Urgent, High, normal, Low. */
const PRIO={uh:{label:"Critical",cls:"crit",rank:0},u:{label:"Urgent",cls:"urg",rank:1},h:{label:"High priority",cls:"high",rank:2},"":{label:"",cls:"",rank:3},l:{label:"Low priority",cls:"low",rank:4}};
function prioCode(p){return PRIO[p]?p:""}
function prioRank(p){return PRIO[prioCode(p)].rank}
function prioBadge(p){p=prioCode(p);return p?h("span",{class:"prio "+PRIO[p].cls,text:PRIO[p].label}):null}
function prioPicker(p,onchange,label){p=prioCode(p);const u=p==="u"||p==="uh",hi=p==="h"||p==="uh",lo=p==="l";
  const set=(nu,nh,nl)=>onchange(nl?"l":nu&&nh?"uh":nu?"u":nh?"h":"");
  return h("div",{class:"prio-pick",role:"group","aria-label":label||"Priority"},
    h("button",{type:"button",class:"urg","aria-pressed":String(u),title:"Urgent (with High = Critical)",onclick:()=>set(!u,hi,false)},"Urgent"),
    h("button",{type:"button",class:"high","aria-pressed":String(hi),title:"High priority",onclick:()=>set(u,!hi,false)},"High"),
    h("button",{type:"button",class:"low","aria-pressed":String(lo),title:"Low priority",onclick:()=>set(false,false,!lo)},"Low"))}
function savedTasks(uid,key){const P=planDoc(uid,key)||{};return lines(P.tasks).map(t=>({t,p:prioCode(P.prio?.[tkey(t)])}))}
function blurNow(){try{document.activeElement?.blur?.()}catch{}}
function refocus(id){setTimeout(()=>{const el=document.getElementById(id);if(el)el.focus()},80)}
function planFor(uid,ym,d,depth=0){
  if(isOff(uid,ym,d)||holidayOn(uid,ym,d)||fullLeaveOn(uid,ym,d))return[];
  const key=ym+"-"+pad(d),P=planDoc(uid,key)||{},drop=new Set(P.drop||[]);
  const out=[],seen=new Set();
  const add=(t,src,x={})=>{const k=tkey(t);if(seen.has(k)||(src==="carried"&&drop.has(k)))return;seen.add(k);out.push({k,text:t,src,p:"",...x})};
  lines(S.members[uid]?.routine).forEach(t=>add(t,"routine"));
  (P.redo||[]).forEach(r=>r&&r.t&&add(r.t,"redo",{from:r.from,note:r.note||"",fromUser:r.fromUser||"",p:prioCode(r.p)}));
  if(depth<CARRY_DEPTH){const pk=prevPlanDay(uid,key);if(pk){const e=S.entries[uid+"|"+pk.slice(0,7)]?.days?.[pk.slice(8)];
    for(const t of planFor(uid,pk.slice(0,7),Number(pk.slice(8)),depth+1)){if(t.src==="routine")continue;const v=taskVal(e?.checks?.[t.k]);if(v&&v.s!=null&&v.s>=taskMax(uid,pk.slice(0,7),Number(pk.slice(8))))continue;add(t.text,"carried",{from:t.from||pk,note:t.note||"",p:t.p})}}}
  lines(P.tasks).forEach(t=>add(t,"assigned",{p:prioCode(P.prio?.[tkey(t)])}));
  (P.mine||[]).forEach(x=>x&&x.t&&add(x.t,"self",{p:prioCode(x.p)}));
  return out.sort((a,b)=>prioRank(a.p)-prioRank(b.p))}
function srcTag(t){return t.src==="routine"?["","Daily routine"]:t.src==="self"?["s","Self-added"]:t.src==="carried"?["c","Backlog · pending since "+fmtKey(t.from)]:t.src==="redo"?["r",(t.fromUser?"Reassigned from "+nm(t.fromUser)+" · "+fmtKey(t.from):"Redo · reposted from "+fmtKey(t.from))+(t.note?" · "+t.note:"")]:["a","Assigned"]}


function pad(n){return String(n).padStart(2,"0")}
function ymOf(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)}
function todayKey(){const p=istParts();return p.year+"-"+p.month+"-"+p.day}
function daysIn(ym){const [y,m]=ym.split("-").map(Number);return new Date(y,m,0).getDate()}
function dateOf(ym,d){const [y,m]=ym.split("-").map(Number);return new Date(y,m-1,d)}
function isSunday(ym,d){return dateOf(ym,d).getDay()===0}
function monthName(ym){return dateOf(ym,1).toLocaleDateString("en-IN",{month:"long",year:"numeric"})}
function shiftMonth(ym,k){const d=dateOf(ym,1);d.setMonth(d.getMonth()+k);return ymOf(d)}
function fmtDay(ym,d){return dateOf(ym,d).toLocaleDateString("en-IN",{weekday:"short",day:"numeric",month:"short"})}
function h(tag,attrs,...kids){const e=document.createElement(tag);
  if(attrs)for(const[k,v]of Object.entries(attrs)){if(v==null||v===false)continue;
    if(k.startsWith("on"))e.addEventListener(k.slice(2),v);else if(k==="class")e.className=v;else if(k==="text")e.textContent=v;else e.setAttribute(k,v===true?"":v)}
  for(const k of kids.flat()){if(k==null||k===false)continue;e.append(k.nodeType?k:document.createTextNode(String(k)))}
  return e}
function toast(msg){const t=h("div",{class:"toast",role:"status",text:msg});document.body.append(t);setTimeout(()=>t.remove(),2600)}

/* ---------- scoring model ---------- */
function dayInfo(uid,ym,d){
  const dd=pad(d), e=S.entries[uid+"|"+ym]?.days?.[dd], sc=S.scores[uid+"|"+ym]?.days?.[dd];
  const key=ym+"-"+dd, today=todayKey();
  const hol=holidayOn(uid,ym,d), lv=leaveOn(uid,ym,d), off=isOff(uid,ym,d), partial=lv?.type==="partial", b={e,sc,hol,lv,off,key,partial};
  const bonusDay=(hol||off)&&e?.status==="worked";
  if(sc&&sc.approved&&!(e&&e.at>sc.at&&e.status==="worked")) return {...b,kind:"scored",score:Number(sc.final),bonus:bonusDay};
  if(lv&&!partial) return {...b,kind:"leave",score:0,ltype:lv.type||"paid"};
  if(partial&&!e&&key<today&&!graceOpen(key)) return {...b,kind:"leave",score:0,ltype:"partial"};
  if(e?.status==="leave") return {...b,kind:"leave",score:0,ltype:"paid"};

function monthStats(uid,ym){

    if(i.kind==="holiday")hols++;

function memDB(){
  const KEY="ics-demo-db-v3";let docs;
  try{docs=JSON.parse(localStorage.getItem(KEY)||"null")}catch{}
  if(!docs){docs=JSON.parse(JSON.stringify(DEMO_SEED));docs["meta/added-krisha"]={at:0}}
  else if(!docs["meta/added-krisha"]){for(const p of Object.keys(DEMO_SEED))if(!(p in docs)&&/^(members|plans)\/demo-krisha/.test(p))docs[p]=JSON.parse(JSON.stringify(DEMO_SEED[p]));docs["meta/added-krisha"]={at:Date.now()}}  // people added to the demo later
  const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(docs))}catch{}};
  const subs=new Set();const fire=()=>setTimeout(()=>subs.forEach(f=>f()),0);
  const clone=v=>v==null?v:JSON.parse(JSON.stringify(v));
  const merge=(a,b)=>{const o={...(a||{})};for(const[k,v]of Object.entries(b)){o[k]=v&&typeof v==="object"&&!Array.isArray(v)&&o[k]&&typeof o[k]==="object"&&!Array.isArray(o[k])?merge(o[k],v):clone(v)}return o};
  const docSnap=p=>({exists:p in docs,id:p.split("/").pop(),data:()=>clone(docs[p])});
  return{
    doc(path){return{
      get:async()=>docSnap(path),
      set:async d=>{docs[path]=clone(d);save();fire()},
      update:async d=>{if(!(path in docs))throw{code:"invalid_argument"};docs[path]=merge(docs[path],d);save();fire()},
      delete:async()=>{delete docs[path];save();fire()},
      onSnapshot(cb){const f=()=>cb(docSnap(path));subs.add(f);setTimeout(f,0);return()=>subs.delete(f)}}},
    collection(path){return{onSnapshot(cb){const f=()=>{const list=Object.keys(docs).filter(k=>k.startsWith(path+"/")&&!k.slice(path.length+1).includes("/")).map(k=>({id:k.slice(path.length+1),data:()=>clone(docs[k])}));cb({docs:list,metadata:{fromCache:false}})};subs.add(f);setTimeout(f,0);return()=>subs.delete(f)}}},
    reset(){docs=JSON.parse(JSON.stringify(DEMO_SEED));save();fire()}
  }}

const RUBRIC_PROMPT=`You score daily work logs for IC Solutions, a web development and digital marketing agency. Score each entry as an integer from 0 to 10.

5 = a full, productive day with clear, specific completed output.
4 = a good day with minor gaps or some planned items left open.
3 = less work than expected; light day.
1-2 = very little completed.
0 = nothing meaningful completed.
6-10 = ONLY for extraordinary work clearly beyond a normal day (e.g. shipped a major feature, rescued a client emergency, exceptional volume). 10 is the maximum and rare.
Each entry lists the tasks the manager assigned, each with the employee's own self-score out of 5 (5 = perfectly done) and their comment on that task, plus optional overall notes and any other work. Weigh completion of assigned tasks most. A task of type "carried over" was left unfinished on an earlier day; "redo" means the manager was not satisfied with an earlier attempt, so judge it against the manager's note. Check that each comment actually supports its self-score: a high self-score with a vague or missing comment should not be trusted, and an honest low self-score with a clear reason is fine. If no tasks were assigned, judge the update on its own. If partial_leave is true the person was on partial leave and did only a little work: the most you can give is 4 (4 = the best work possible on a partial day). If off_day is set, the employee chose to work on a holiday or weekly off: score the work on its merits and mention in the reason that it was off-day work, since the manager may add bonus points.
Judge completed work against what was planned, how specific and verifiable it is, and its impact. Vague claims score lower. Length alone earns nothing.
